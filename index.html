<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ночь в музее — программа и услуги</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="page">
    <article class="event-card" aria-labelledby="event-title">
      <p class="eyebrow">Вечер в музее космонавтики</p>
      <h1 id="event-title">Ночь в музее</h1>
      <p id="event-date" class="event-date">15 ноября, 18:30</p>
      <p id="event-place" class="event-place">Музей космонавтики, проспект Мира, 111</p>
      <p id="event-description">Вечерняя программа с выставкой и экскурсиями</p>
      <button id="show-program" class="program-button" type="button" aria-controls="program" aria-expanded="false">Показать программу</button>
      <p id="program" class="program" hidden></p>
    </article>

    <p id="data-error" class="error" role="alert" hidden></p>

    <form id="service-form" class="service-form" hidden>
      <fieldset>
        <legend>Дополнительные услуги</legend>
        <p class="form-hint">Выберите, чем дополнить ваш вечер.</p>
        <label class="service-choice" for="guide">
          <input id="guide" name="guide" type="checkbox">
          Экскурсия с гидом <span class="price">— 500 руб.</span>
        </label>
        <label class="service-choice" for="audio">
          <input id="audio" name="audio" type="checkbox">
          Аудиогид <span class="price">— 350 руб.</span>
        </label>
        <label class="service-choice" for="catalog">
          <input id="catalog" name="catalog" type="checkbox">
          Каталог выставки <span class="price">— 250 руб.</span>
        </label>
      </fieldset>
      <p id="choice-error" class="error" role="alert" hidden></p>
      <button class="calculate-button" type="submit">Рассчитать стоимость</button>
    </form>

    <p id="result" class="result" aria-live="polite" hidden></p>
    <pre id="report-json" class="report-json" aria-label="Отчёт в формате JSON" hidden></pre>
  </main>
  <script src="./app.js"></script>
</body>
</html>
